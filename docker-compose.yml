services:
  db:
    image: postgres:16
    container_name: fraud-db
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - fraud_pgdata:/var/lib/postgresql/data

  app:
    container_name: fraud-app
    build:
      context: .
      dockerfile: Dockerfile
    image: fraud-rule-engine:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fraud
      SPRING_DATASOURCE_USERNAME: fraud
      SPRING_DATASOURCE_PASSWORD: fraud
      SPRING_FLYWAY_ENABLED: "true"

      ALERT_ENABLED: "true"
      ALERT_PROVIDER: "WEBHOOK"
      ALERT_WEBHOOK_URL: "https://webhook.site/be3ed73b-430c-4212-b08d-da58503217a3"
      ALERT_SOURCE: "fraud-rule-engine"
      ALERT_SEVERITY_HIGH: "critical"
    ports:
      - "8081:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  fraud_pgdata:
